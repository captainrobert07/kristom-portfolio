<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1c"/>
      <stop offset="50%" stop-color="#0f1a30"/>
      <stop offset="100%" stop-color="#070912"/>
    </linearGradient>
    <radialGradient id="warm" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="rgba(150,190,255,0.45)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
    <radialGradient id="cool" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="rgba(70,130,230,0.40)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cfe2ff"/>
      <stop offset="50%" stop-color="#5b9bff"/>
      <stop offset="100%" stop-color="#92baff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#warm)"/>
  <rect width="1200" height="630" fill="url(#cool)"/>

  <!-- corner brackets -->
  <g stroke="rgba(150,190,255,0.4)" stroke-width="1.5" fill="none">
    <path d="M 36 36 H 80 M 36 36 V 80"/>
    <path d="M 1164 36 H 1120 M 1164 36 V 80"/>
    <path d="M 36 594 H 80 M 36 594 V 550"/>
    <path d="M 1164 594 H 1120 M 1164 594 V 550"/>
  </g>

  <!-- chapter label -->
  <text x="80" y="100" font-family="system-ui, sans-serif" font-size="14" letter-spacing="6" fill="rgba(255,255,255,0.55)">
    KRISTOM ROBERT  ·  PORTFOLIO  ·  2026
  </text>

  <!-- main wordmark -->
  <text x="80" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="98" font-weight="600" fill="#ffffff" letter-spacing="-3">
    Data,
  </text>
  <text x="80" y="390" font-family="Georgia, 'Times New Roman', serif" font-size="108" font-style="italic" font-weight="300" fill="url(#accent)" letter-spacing="-3">
    Translated Into
  </text>
  <text x="80" y="500" font-family="system-ui, -apple-system, sans-serif" font-size="98" font-weight="600" fill="#ffffff" letter-spacing="-3">
    Decisions.
  </text>

  <!-- footer band -->
  <text x="80" y="580" font-family="ui-monospace, monospace" font-size="14" letter-spacing="4" fill="rgba(255,255,255,0.45)">
    POWER BI  ·  TABLEAU  ·  SQL  ·  SAS  ·  AUTOMATION  ·  GOVERNANCE
  </text>
</svg>
